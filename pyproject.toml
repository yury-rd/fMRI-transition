[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fmri-transition"
version = "1.0.0"
description = "Synthetic benchmarks comparing HMM and VAR models for state transitions in short resting-state fMRI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "scikit-learn>=1.6,<2", "mpmath>=1.3,<2", "threadpoolctl>=3.5,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fmri_observations*"]
